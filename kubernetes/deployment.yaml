apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-inference
  namespace: mlops-agent
  labels:
    app: iris-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-inference
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app: iris-inference
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: api
          image: mlops-inference:1.0.0        # build: docker build -t mlops-inference:1.0.0 .
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: iris-inference-config
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
