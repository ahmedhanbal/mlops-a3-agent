# Least-privilege identity for the agent: read pods/logs/events/services/configmaps/deployments,
# and patch deployments (rollout restart) - ONLY inside the mlops-agent namespace.
apiVersion: v1
kind: ServiceAccount
metadata: {name: mlops-agent, namespace: mlops-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mlops-agent-operator, namespace: mlops-agent}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mlops-agent-operator, namespace: mlops-agent}
subjects: [{kind: ServiceAccount, name: mlops-agent, namespace: mlops-agent}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mlops-agent-operator}
