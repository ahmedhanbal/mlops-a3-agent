name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (reproducible environment from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (Kubernetes, Airflow and LLM calls are mocked; no external services, no secrets)
        env:
          AGENT_LLM: rules
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          pytest -q
      - name: Validate Kubernetes manifests parse
        run: python -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('kubernetes/*.yaml')]; print('manifests ok')"
