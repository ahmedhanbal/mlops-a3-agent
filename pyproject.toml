[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "1.0.0"
description = "Assignment 03: production-ready MLOps AI agent (DVC, MLflow, Airflow 3, Kubernetes)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "requests>=2.31",
  "pyyaml>=6.0",
  "mlflow>=2.14",
  "dvc>=3.50",
  "kubernetes>=29.0",
  "anthropic>=0.40",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["agent", "agent.tools", "api", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real dvc/git binaries (skipped when absent)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]
